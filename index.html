<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Screen Game Embed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
    }
  </style>
</head>
<body class="w-screen h-screen m-0 p-0 overflow-hidden bg-black">

  <!-- 100% Fullscreen Embed Container -->
  <iframe 
    id="gameDisplayFrame" 
    src="https://algebra-skills-us.github.io/Yup/" 
    class="w-full h-full border-0 block" 
    allow="autoplay; gamepad" 
    allowfullscreen>
  </iframe>

</body>
</html>
